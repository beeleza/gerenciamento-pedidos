server:
  port: 8082

spring:
  application:
    name: print-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: print-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false  # o producer não envia o nome da classe nos headers
        spring.json.value.default.type: com.beeleza.print_service.event.OrderCreatedEvent
        spring.json.trusted.packages: com.beeleza.print_service.event

app:
  kafka:
    topics:
      order-created: order-created

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Consome pedidos do Kafka e exibe no console
